name: Publish Package

on:
  push:
    tags:
      - "release-*"
    branches:
      - "main"

jobs:
  publish-package:
    permissions:
      contents: write
      packages: write
    uses: KadavasKingdom/workflows/.github/workflows/package.yml@main
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
